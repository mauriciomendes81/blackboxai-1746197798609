<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluxo</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts - Roboto -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
</head>
<body class="font-['Roboto'] min-h-screen bg-gray-50">
    <!-- Header -->
    <header class="fixed top-0 left-0 w-full bg-blue-500 text-white py-3 shadow-md z-50">
        <h1 class="text-2xl font-bold text-center select-none mb-2">Fluxo</h1>
        <div class="flex justify-center gap-3">
            <button id="btn-list" class="px-6 py-1.5 bg-white text-blue-600 rounded-md hover:bg-gray-100 transition-colors text-sm font-medium shadow-sm">Lista</button>
            <button id="btn-extra" class="px-6 py-1.5 bg-white text-blue-600 rounded-md hover:bg-gray-100 transition-colors text-sm font-medium shadow-sm">Ação Extra</button>
        </div>
    </header>

    <!-- Sidebar -->
    <aside class="fixed left-0 top-[84px] bottom-[60px] w-64 bg-white border-r border-gray-200 shadow-sm">
        <div class="p-4">
            <p class="text-center font-medium text-lg text-gray-800 mb-2">Opções</p>
            <hr class="border-gray-200 mb-4">
            <div class="flex flex-col gap-2.5">
                <button id="btn-divider" class="w-full px-4 py-2 bg-blue-500 text-white rounded-md hover:bg-blue-600 transition-colors text-sm font-medium shadow-sm">Divisória</button>
                <button id="btn-textbox" class="w-full px-4 py-2 bg-blue-500 text-white rounded-md hover:bg-blue-600 transition-colors text-sm font-medium shadow-sm">Caixa de texto</button>
                <button id="btn-hiddentextbox" class="w-full px-4 py-2 bg-blue-500 text-white rounded-md hover:bg-blue-600 transition-colors text-sm font-medium shadow-sm">caixa de texto oculta</button>
                <button id="btn-container" class="w-full px-4 py-2 bg-blue-500 text-white rounded-md hover:bg-blue-600 transition-colors text-sm font-medium shadow-sm">Conteiner</button>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="ml-64 mt-[84px] mb-[60px] p-6 bg-white min-h-screen">
        <div id="edit-mode-banner" class="bg-yellow-300 text-yellow-800 text-center p-2 mb-4 hidden">
            MODO DE ATUALIZAÇÃO: Atualize e remova objetos clicando no ícone 'x'
        </div>
    <div class="flex gap-4 mb-4">
            <div class="flex-1">
                <input type="text" id="input-object" placeholder="Objeto" class="w-full px-4 py-2.5 border border-gray-300 rounded-md focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors">
            </div>
            <div class="flex-1">
                <input type="text" id="input-description" placeholder="Descrição" class="w-full px-4 py-2.5 border border-gray-300 rounded-md focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors">
            </div>
            <div class="flex-1">
                <input type="text" id="input-author" placeholder="Autor" class="w-full px-4 py-2.5 border border-gray-300 rounded-md focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors">
            </div>
        </div>
        <hr class="border-gray-200">
        <div id="dynamic-content" class="mt-4">
            <!-- Dynamic content will be added here -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="fixed bottom-0 left-0 w-full bg-blue-500 py-3 shadow-md z-50">
        <div class="flex justify-center gap-3">
            <button id="btn-save" class="px-6 py-1.5 bg-white text-blue-600 rounded-md hover:bg-gray-100 transition-colors text-sm font-medium shadow-sm">Salvar</button>
            <button id="btn-load" class="px-6 py-1.5 bg-white text-blue-600 rounded-md hover:bg-gray-100 transition-colors text-sm font-medium shadow-sm">Abrir Arquivo</button>
        </div>
    </footer>
    <script src="app.js"></script>
</body>
</html>
